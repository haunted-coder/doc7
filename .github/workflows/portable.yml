name: Windows Portable

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version shown in the portable package
        required: true
        type: string
      commit:
        description: Commit or tag to package
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify repository size policy
        shell: bash
        run: bash scripts/check-repository-size.sh

      - name: Verify public source policy
        shell: bash
        run: bash scripts/check-public-source.sh

      - name: Build portable package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          BUILD_COMMIT: ${{ inputs.commit }}
        run: |
          $buildDate = git show -s --format=%cI HEAD
          ./scripts/build-windows-portable.ps1 `
            -Version $env:VERSION `
            -BuildCommit $env:BUILD_COMMIT `
            -BuildDate $buildDate

      - name: Publish rolling portable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          BUILD_COMMIT: ${{ inputs.commit }}
        run: |
          gh release view portable-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete portable-latest --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "failed to remove the previous portable-latest release"
            }
          }

          $releaseDirectory = Resolve-Path "dist/portable/$env:VERSION"
          $releaseFiles = Get-ChildItem -LiteralPath $releaseDirectory -File | ForEach-Object { $_.FullName }
          gh release create portable-latest @releaseFiles `
            --target $env:BUILD_COMMIT `
            --title "Windows Portable - Latest ($env:VERSION)" `
            --notes "Includes doc7, LibreOffice Portable, and MuPDF. Download the ZIP, extract it to a short path such as C:\doc7, and configure your own model endpoint." `
            --prerelease
          if ($LASTEXITCODE -ne 0) {
            throw "failed to publish the portable-latest release"
          }
