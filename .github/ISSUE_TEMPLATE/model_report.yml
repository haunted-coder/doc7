name: Model report
description: Report real doc7 results from a multimodal model or runtime
title: "[Model] "
body:
  - type: markdown
    attributes:
      value: Report observed results. Do not include API keys, private endpoint URLs, or confidential documents.
  - type: input
    id: version
    attributes:
      label: doc7 version
      placeholder: v0.1.0 or the output of doc7 version
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model ID
      placeholder: The exact model ID returned by the endpoint
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime or provider
      placeholder: LM Studio, vLLM, Ollama-compatible gateway, or hosted API
    validations:
      required: true
  - type: input
    id: inputs
    attributes:
      label: Input types tried
      placeholder: DOCX, chart-heavy PDF, scanned pages, screenshots
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Observed results
      description: Describe what worked, what failed, and any settings that materially changed the output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Optional operating system, hardware, runtime version, and relevant non-secret configuration.
