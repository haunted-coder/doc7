name: Bug report
description: Report a reproducible doc7 failure
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Remove API keys, private URLs, and confidential document content before submitting.
  - type: input
    id: version
    attributes:
      label: doc7 version
      placeholder: v0.1.0 or the output of doc7 version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: input_type
    attributes:
      label: Input type
      placeholder: PDF, DOCX, PPTX, XLSX, PNG, ZIP, URL, or directory
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Include the complete command after removing credentials and private paths.
      render: shell
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: Include the full error and relevant verbose output.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: share_input
    attributes:
      label: Can the input document be shared with maintainers?
      options:
        - Yes, publicly
        - Yes, privately or after redaction
        - No
    validations:
      required: true
